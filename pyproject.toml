[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-seo-intelligence"
version = "1.0.0"
description = "YouTube SEO Intelligence: palavras-chave, SERP, concorrentes, títulos/miniaturas e lacunas, na cota gratuita."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Benther" }]
dependencies = []

[project.optional-dependencies]
vision = ["numpy", "opencv-python-headless", "rapidocr-onnxruntime"]
dev = ["pytest>=8"]

[project.scripts]
youtube-seo = "youtube_seo.cli:main"

[tool.setuptools.packages.find]
include = ["youtube_seo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
